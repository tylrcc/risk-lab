[project]
name = "risklab"
version = "0.1.0"
description = "Portfolio risk analytics and credit default prediction."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tylrcc" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
risklab = "risklab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["risklab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
